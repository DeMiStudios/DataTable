name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check formatting
        run: stylua --check src tests examples

      - name: Install packages
        run: wally install

      - name: Type-check
        run: |
          rojo sourcemap test.project.json -o sourcemap.json
          curl -fsSL -o "$RUNNER_TEMP/globalTypes.d.luau" \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          luau-lsp analyze --platform=roblox --sourcemap=sourcemap.json \
            --definitions="$RUNNER_TEMP/globalTypes.d.luau" --flag:LuauSolverV2=true \
            --ignore="DevPackages/**" src tests examples
